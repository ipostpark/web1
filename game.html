<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한자리수 사칙연산 게임</title>
  <style>
    :root {
      --bg1: #eef4ff;
      --bg2: #f9fbff;
      --card: rgba(255, 255, 255, 0.9);
      --text: #172033;
      --muted: #68738a;
      --primary: #4f6df5;
      --primary-dark: #3954d7;
      --success: #159b69;
      --danger: #e64c5b;
      --border: #dfe6f3;
      --shadow: 0 20px 50px rgba(63, 82, 130, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #dfe8ff 0, transparent 35%),
        radial-gradient(circle at bottom right, #e2f7ef 0, transparent 35%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
    }

    .game-card {
      width: min(100%, 520px);
      padding: 28px;
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: clamp(25px, 6vw, 38px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 0 0 24px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
    }

    .top-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat {
      padding: 12px 8px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: white;
    }

    .stat-label {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    .stat-value {
      font-size: 21px;
      font-weight: 800;
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: white;
      color: var(--text);
      font: inherit;
    }

    .question-box {
      display: grid;
      place-items: center;
      min-height: 160px;
      margin-bottom: 18px;
      padding: 20px;
      border-radius: 22px;
      background: linear-gradient(135deg, #4f6df5, #7b59dd);
      color: white;
      text-align: center;
    }

    .question {
      font-size: clamp(42px, 12vw, 72px);
      font-weight: 900;
      letter-spacing: 0.02em;
      text-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    .answer-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
    }

    #answer {
      min-width: 0;
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: 16px;
      outline: none;
      text-align: center;
      font-size: 28px;
      font-weight: 800;
      transition: 0.2s;
    }

    #answer:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(79, 109, 245, 0.13);
    }

    button {
      border: 0;
      border-radius: 16px;
      cursor: pointer;
      font: inherit;
      font-weight: 800;
      transition: transform 0.12s, background 0.2s, opacity 0.2s;
    }

    button:active {
      transform: scale(0.97);
    }

    .submit-btn {
      padding: 0 24px;
      background: var(--primary);
      color: white;
    }

    .submit-btn:hover {
      background: var(--primary-dark);
    }

    .message {
      min-height: 30px;
      margin: 12px 0 8px;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
    }

    .message.correct {
      color: var(--success);
    }

    .message.wrong {
      color: var(--danger);
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      margin: 10px 0 18px;
      border-radius: 999px;
      background: #e8edf7;
    }

    .progress {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #38b889, #4f6df5);
      transition: width 1s linear;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .secondary-btn {
      padding: 13px;
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
    }

    .start-btn {
      padding: 13px;
      background: #172033;
      color: white;
    }

    .result-panel {
      display: none;
      margin-top: 20px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: white;
      text-align: center;
    }

    .result-panel.show {
      display: block;
    }

    .result-score {
      margin: 4px 0;
      font-size: 42px;
      font-weight: 900;
      color: var(--primary);
    }

    .small-note {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 450px) {
      .game-card {
        padding: 20px;
        border-radius: 22px;
      }

      .settings {
        grid-template-columns: 1fr;
      }

      .answer-row {
        grid-template-columns: 1fr;
      }

      .submit-btn {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="game-card">
    <h1>🧮 사칙연산 게임</h1>
    <p class="subtitle">한 자리 숫자로 나오는 문제를 빠르게 풀어보세요.</p>

    <section class="top-bar">
      <div class="stat">
        <span class="stat-label">점수</span>
        <span class="stat-value" id="score">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">연속 정답</span>
        <span class="stat-value" id="streak">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">남은 시간</span>
        <span class="stat-value"><span id="time">60</span>초</span>
      </div>
    </section>

    <section class="settings">
      <label>
        연산 선택
        <select id="operation">
          <option value="all">사칙연산 전체</option>
          <option value="+">덧셈</option>
          <option value="-">뺄셈</option>
          <option value="×">곱셈</option>
          <option value="÷">나눗셈</option>
        </select>
      </label>

      <label>
        게임 시간
        <select id="duration">
          <option value="30">30초</option>
          <option value="60" selected>60초</option>
          <option value="90">90초</option>
        </select>
      </label>
    </section>

    <section class="question-box" aria-live="polite">
      <div class="question" id="question">시작!</div>
    </section>

    <div class="progress-track" aria-label="남은 시간">
      <div class="progress" id="progress"></div>
    </div>

    <form id="answerForm" class="answer-row">
      <input
        id="answer"
        type="number"
        inputmode="numeric"
        placeholder="정답 입력"
        autocomplete="off"
        disabled
        aria-label="정답 입력"
      />
      <button class="submit-btn" type="submit" disabled id="submitBtn">확인</button>
    </form>

    <div class="message" id="message" aria-live="polite">
      아래 시작 버튼을 눌러주세요.
    </div>

    <div class="actions">
      <button class="secondary-btn" type="button" id="skipBtn" disabled>문제 넘기기</button>
      <button class="start-btn" type="button" id="startBtn">게임 시작</button>
    </div>

    <section class="result-panel" id="resultPanel">
      <div class="small-note">최종 점수</div>
      <div class="result-score" id="finalScore">0점</div>
      <div id="resultText"></div>
    </section>
  </main>

  <script>
    const questionEl = document.getElementById("question");
    const answerEl = document.getElementById("answer");
    const scoreEl = document.getElementById("score");
    const streakEl = document.getElementById("streak");
    const timeEl = document.getElementById("time");
    const messageEl = document.getElementById("message");
    const progressEl = document.getElementById("progress");
    const startBtn = document.getElementById("startBtn");
    const skipBtn = document.getElementById("skipBtn");
    const submitBtn = document.getElementById("submitBtn");
    const answerForm = document.getElementById("answerForm");
    const operationSelect = document.getElementById("operation");
    const durationSelect = document.getElementById("duration");
    const resultPanel = document.getElementById("resultPanel");
    const finalScoreEl = document.getElementById("finalScore");
    const resultTextEl = document.getElementById("resultText");

    let score = 0;
    let streak = 0;
    let correctCount = 0;
    let totalCount = 0;
    let currentAnswer = 0;
    let timeLeft = 60;
    let totalTime = 60;
    let timer = null;
    let isPlaying = false;

    function randomDigit(min = 0, max = 9) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function chooseOperation() {
      const selected = operationSelect.value;
      if (selected !== "all") return selected;

      const operations = ["+", "-", "×", "÷"];
      return operations[Math.floor(Math.random() * operations.length)];
    }

    function makeQuestion() {
      const op = chooseOperation();
      let a;
      let b;

      if (op === "+") {
        a = randomDigit();
        b = randomDigit();
        currentAnswer = a + b;
      }

      if (op === "-") {
        a = randomDigit();
        b = randomDigit();
        if (b > a) [a, b] = [b, a];
        currentAnswer = a - b;
      }

      if (op === "×") {
        a = randomDigit();
        b = randomDigit();
        currentAnswer = a * b;
      }

      if (op === "÷") {
        b = randomDigit(1, 9);
        currentAnswer = randomDigit(0, 9);
        a = b * currentAnswer;
      }

      questionEl.textContent = `${a} ${op} ${b} = ?`;
      answerEl.value = "";
      answerEl.focus();
    }

    function updateStats() {
      scoreEl.textContent = score;
      streakEl.textContent = streak;
      timeEl.textContent = timeLeft;
      progressEl.style.width = `${(timeLeft / totalTime) * 100}%`;
    }

    function showMessage(text, type = "") {
      messageEl.textContent = text;
      messageEl.className = "message";
      if (type) messageEl.classList.add(type);
    }

    function startGame() {
      clearInterval(timer);

      score = 0;
      streak = 0;
      correctCount = 0;
      totalCount = 0;
      totalTime = Number(durationSelect.value);
      timeLeft = totalTime;
      isPlaying = true;

      operationSelect.disabled = true;
      durationSelect.disabled = true;
      answerEl.disabled = false;
      submitBtn.disabled = false;
      skipBtn.disabled = false;
      startBtn.textContent = "다시 시작";
      resultPanel.classList.remove("show");

      updateStats();
      makeQuestion();
      showMessage("정답을 입력하고 Enter를 누르세요.");

      timer = setInterval(() => {
        timeLeft--;
        updateStats();

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      clearInterval(timer);
      isPlaying = false;

      answerEl.disabled = true;
      submitBtn.disabled = true;
      skipBtn.disabled = true;
      operationSelect.disabled = false;
      durationSelect.disabled = false;

      questionEl.textContent = "게임 종료!";
      showMessage("수고했어요! 다시 도전해보세요.");

      const accuracy = totalCount === 0
        ? 0
        : Math.round((correctCount / totalCount) * 100);

      finalScoreEl.textContent = `${score}점`;
      resultTextEl.textContent =
        `정답 ${correctCount}개 · 총 ${totalCount}문제 · 정답률 ${accuracy}%`;
      resultPanel.classList.add("show");
    }

    function checkAnswer(event) {
      event.preventDefault();

      if (!isPlaying) return;

      const value = answerEl.value.trim();

      if (value === "") {
        showMessage("정답을 먼저 입력하세요.", "wrong");
        answerEl.focus();
        return;
      }

      totalCount++;
      const userAnswer = Number(value);

      if (userAnswer === currentAnswer) {
        streak++;
        correctCount++;

        const bonus = streak >= 5 ? 2 : 1;
        score += bonus;

        showMessage(
          bonus === 2 ? "정답! 연속 정답 보너스 +2점 🎉" : "정답입니다! +1점",
          "correct"
        );
      } else {
        streak = 0;
        showMessage(`아쉬워요. 정답은 ${currentAnswer}입니다.`, "wrong");
      }

      updateStats();

      setTimeout(() => {
        if (isPlaying) makeQuestion();
      }, 350);
    }

    function skipQuestion() {
      if (!isPlaying) return;

      totalCount++;
      streak = 0;
      showMessage(`넘겼습니다. 정답은 ${currentAnswer}입니다.`, "wrong");
      updateStats();

      setTimeout(() => {
        if (isPlaying) makeQuestion();
      }, 350);
    }

    startBtn.addEventListener("click", startGame);
    skipBtn.addEventListener("click", skipQuestion);
    answerForm.addEventListener("submit", checkAnswer);

    updateStats();
  </script>
</body>
</html>
